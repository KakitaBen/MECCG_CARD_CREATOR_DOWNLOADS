name: Verify Windows installer
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full source commit used to prepare the draft (40 characters)
        type: string
        required: true
      release_version:
        description: Existing draft application release to verify (for example v0.60.33)
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: public-delivery
  cancel-in-progress: false
env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GH_TOKEN: ${{ github.token }}
defaults:
  run:
    shell: bash

jobs:
  windows-check:
    if: github.repository == 'KakitaBen/MECCG_CARD_CREATOR_DOWNLOADS' && github.actor == 'KakitaBen'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Validate source and draft release selection
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Build stopped: step=source-selection, category=invalid-data'; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Build stopped: step=release-selection, category=invalid-data'; exit 1; }
          test -n "$READ_TOKEN" || { echo 'Build stopped: step=source-selection, category=missing-credential'; exit 1; }
      - uses: actions/checkout@v4
        with: {path: publisher, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: KakitaBen/MECCG_AUTO_CARD_EDITOR
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m unittest discover -s publisher/tests
      - run: choco install innosetup --version=6.7.1 --allow-downgrade -y --no-progress
      - env: {RELEASE_VERSION: "${{ inputs.release_version }}"}
        run: python publisher/tools/delivery.py installer --release "$RELEASE_VERSION" --platform windows-x64
