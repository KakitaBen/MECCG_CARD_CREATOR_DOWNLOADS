name: Build application installers
on:
  push:
    branches: [main]
    paths: [".github/workflows/**", "tools/**", "tests/**"]
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full validated source commit (40 characters)
        type: string
        required: true
      illustrations_version:
        description: Published illustration collection to install
        type: string
        required: true
        default: "1.00"
permissions:
  contents: write
concurrency:
  group: public-delivery
  cancel-in-progress: false
env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GH_TOKEN: ${{ github.token }}
defaults:
  run:
    shell: bash

jobs:
  runner-check:
    if: github.repository == 'KakitaBen/MECCG_CARD_CREATOR_DOWNLOADS' && github.actor == 'KakitaBen'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {path: publisher, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m unittest discover -s publisher/tests
      - run: echo "Standard public runner is available. No private source was needed for this check."
  prepare:
    needs: runner-check
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate selected source and read access
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          COLLECTION: ${{ inputs.illustrations_version }}
          READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Select a full validated source commit.'; exit 1; }
          [[ "$COLLECTION" =~ ^v?[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Build stopped: step=collection-selection, category=invalid-data'; exit 1; }
          test -n "$READ_TOKEN" || { echo 'Add SOURCE_READ_TOKEN with read-only access to the private source repository.'; exit 1; }
      - uses: actions/checkout@v4
        with: {path: publisher, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: KakitaBen/MECCG_AUTO_CARD_EDITOR
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - id: release
        env: {SOURCE_COMMIT: "${{ inputs.source_commit }}"}
        run: python publisher/tools/delivery.py prepare --commit "$SOURCE_COMMIT"
  resources:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {path: publisher, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: KakitaBen/MECCG_AUTO_CARD_EDITOR
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - env: {RELEASE_VERSION: "${{ needs.prepare.outputs.version }}", COLLECTION: "${{ inputs.illustrations_version }}"}
        run: python publisher/tools/delivery.py resources --release "$RELEASE_VERSION" --collection "$COLLECTION"
  programs:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: windows-x64}
          - {os: macos-15-intel, platform: macos-x64}
          - {os: macos-15, platform: macos-arm64}
          - {os: ubuntu-22.04, platform: linux-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {path: publisher, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: KakitaBen/MECCG_AUTO_CARD_EDITOR
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - if: runner.os == 'Windows'
        run: choco install inkscape -y --no-progress
      - if: runner.os == 'macOS'
        run: brew install --cask inkscape
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libx11-6 libxext6 libxrender1 libxft2
      - env: {RELEASE_VERSION: "${{ needs.prepare.outputs.version }}", TARGET_PLATFORM: "${{ matrix.platform }}"}
        run: python publisher/tools/delivery.py program --release "$RELEASE_VERSION" --platform "$TARGET_PLATFORM"
  manifest:
    needs: [prepare, resources, programs]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {path: publisher, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: KakitaBen/MECCG_AUTO_CARD_EDITOR
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - env: {RELEASE_VERSION: "${{ needs.prepare.outputs.version }}", COLLECTION: "${{ inputs.illustrations_version }}"}
        run: python publisher/tools/delivery.py manifest --release "$RELEASE_VERSION" --collection "$COLLECTION"
  installers:
    needs: [prepare, manifest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: windows-x64}
          - {os: macos-15-intel, platform: macos-x64}
          - {os: macos-15, platform: macos-arm64}
          - {os: ubuntu-22.04, platform: linux-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {path: publisher, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: KakitaBen/MECCG_AUTO_CARD_EDITOR
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - env: {RELEASE_VERSION: "${{ needs.prepare.outputs.version }}", TARGET_PLATFORM: "${{ matrix.platform }}"}
        run: python publisher/tools/delivery.py installer --release "$RELEASE_VERSION" --platform "$TARGET_PLATFORM"
  mac-installer:
    needs: [prepare, installers]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: {path: publisher, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: KakitaBen/MECCG_AUTO_CARD_EDITOR
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - env: {RELEASE_VERSION: "${{ needs.prepare.outputs.version }}"}
        run: python publisher/tools/delivery.py mac --release "$RELEASE_VERSION"
